mandatory:
  # === BASE ESTÁNDAR (NO MODIFICAR) ===
  - instruccion: "Seguir el proceso paso a paso en orden secuencial"
  - instruccion: "Validar prerequisitos antes de ejecutar"
  - instruccion: "Los pasos marcados como obligatorio:true NO se pueden omitir"
  - instruccion: "Nunca saltar proceso.paso_final"
  # === CONFIGURACIÓN DE IDIOMA ===
  - instruccion: "Generar TODOS los artefactos/documentos en el idioma definido en 'idiomas.documentacion'"
  # === ESPECÍFICAS DE LA HERRAMIENTA ===
  - instruccion: "Todo bug DEBE tener contextualización de origen antes de considerarse procesado"
  - instruccion: "SIEMPRE crear HU tipo Bug en el backlog. Buscar HU de origen para trazabilidad"
  - instruccion: "Los bugs afectan funcionalidad del sistema — priorizar resolución"
  - instruccion: "El ID del bug sigue el patrón BUG-NNN (autoincremental basado en carpetas BUG-* existentes en {{artifacts.hu_folder}} y {{artifacts.bugs_folder}} legacy)"
  - instruccion: "Al registrar un bug ya corregido, completar TODAS las secciones incluyendo Corrección y Lección Aprendida"
  - instruccion: "Crear carpeta {{artifacts.hu_folder}}/BUG-NNN/ y copiar plantillas HU.md y RefinamientoBug.md"
  - instruccion: "NO crear archivo BUG-NNN.md separado — toda la información va en RefinamientoBug.md"

# ============================================
# PREREQUISITOS
# ============================================
condiciones_entrada:
  - condicion: "Existe {{archivos.backlog}}"
    si_no_cumple: "No hay backlog disponible. Ejecutar >refinar_hu para crear el backlog primero."

# ============================================
# PARÁMETROS
# ============================================
parametros:
  requeridos:
    - nombre: descripcion
      tipo: string
      descripcion: "Descripción del bug detectado"
  opcionales:
    - nombre: proyecto
      tipo: string
      descripcion: "Nombre del proyecto afectado"
      defecto: null
    - nombre: detectado_en
      tipo: string
      descripcion: "Contexto de detección (ej: HU-010, pruebas funcionales, producción)"
      defecto: null
    - nombre: severidad
      tipo: string
      valores: [critica, alta, media]
      defecto: null
      descripcion: "Severidad del bug. Si se omite, se evalúa durante el proceso."
    - nombre: ya_corregido
      tipo: flag
      descripcion: "Indica que el bug ya fue corregido y se registra post-mortem"

# ============================================
# PROCESO
# ============================================
proceso:
  - paso: "Recepción del Bug"
    obligatorio: true
    acciones:
      - "SI origen = dispatcher: MODO ABREVIADO - Reutilizar descripcion/proyecto/logs/ya_corregido del contexto_transferido. Ejecutar solo asignacion de ID autoincremental."
      - "Recopilar información del bug: descripción, proyecto, contexto de detección"
      - "SI faltan datos críticos (descripción o síntoma) → Solicitar al usuario"
      - "Asignar ID autoincremental: escanear {{artifacts.hu_folder}}/BUG-* y {{artifacts.bugs_folder}}/BUG-* (legacy) para obtener último BUG-NNN y sumar 1"
      - "SI flag --ya_corregido → Recopilar también: commit fix, archivos afectados, código antes/después, lección aprendida"

  - paso: "Clasificación de Severidad"
    obligatorio: true
    acciones:
      - "SI el usuario proporcionó severidad → Usar la indicada"
      - "SI NO → Evaluar según criterios:"
      - "  🔴 Crítica: Bloquea funcionalidad core, pérdida de datos, crash del sistema"
      - "  🟠 Alta: Funcionalidad degradada, workaround difícil, afecta a múltiples usuarios"
      - "  🟡 Media: Funcionalidad menor afectada, workaround disponible"
      - "Mostrar clasificación propuesta y confirmar con usuario"

  - paso: "Análisis de Causa Raíz"
    obligatorio: true
    acciones:
      - "Documentar el síntoma observable (qué ve el usuario o el sistema)"
      - "Identificar la causa raíz técnica (por qué ocurre)"
      - "SI hay inconsistencia entre capas/componentes → Documentar con tabla comparativa"
      - "Listar archivos afectados con descripción del problema en cada uno"

  - paso: "Contextualización — Búsqueda de HU de Origen"
    obligatorio: true
    condicion: "SI NO es --ya_corregido (bugs ya corregidos registran detectado_en directamente)"
    acciones:
      - "Leer {{archivos.backlog}}"
      - "Buscar HUs cuyo alcance funcional cubra el módulo/componente afectado por el bug"
      - "SI encuentra HU(s) candidata(s):"
      - "  Mostrar al usuario las HUs encontradas con su estado actual"
      - "  Preguntar:"
      - "  > 🤷 ¿Este bug se detectó probando alguna de estas HUs?"
      - "  > - [HU-XXX] [Título de la HU]"
      - "  > - ❌ [N] Ninguna — se detectó en otro contexto"
      - "  SI selecciona HU → Registrar detectado_en = HU-XXX"
      - "  SI [N] → Registrar detectado_en = [contexto libre del usuario o parámetro detectado_en]"
      - "SI NO encuentra HUs relacionadas:"
      - "  Registrar detectado_en = [parámetro detectado_en o contexto proporcionado por el usuario]"

  - paso: "Crear HU tipo Bug"
    obligatorio: true
    acciones:
      - "Calcular siguiente BUG-NNN:"
      - "  Escanear {{artifacts.hu_folder}}/BUG-*"
      - "  Escanear {{artifacts.bugs_folder}}/BUG-* (legacy)"
      - "  Tomar el mayor + 1"
      - "Crear carpeta: mkdir {{artifacts.hu_folder}}/BUG-NNN/"
      - "Copiar y rellenar HU.md:"
      - "  Fuente: {{plantillas.hu.hu}}"
      - "  ID: BUG-NNN"
      - "  Título: [Título del bug]"
      - "  Tipo: Bug"
      - "  Proyecto: [proyecto]"
      - "  Prioridad: [según severidad: Crítica→P0, Alta→P1, Media→P2]"
      - "  Complejidad: [inferir de severidad: Crítica→ALTO, Alta→MEDIO, Media→BAJO]"
      - "  Story Points: [—] (se llena con planificar_hu)"
      - "  Estimación: [—] (se llena con planificar_hu)"
      - "  Fecha Creación: [fecha actual ISO 8601]"
      - "  Creado por: registrar_bug"
      - "  Detectado_en: [HU-XXX / contexto]"
      - "Copiar y rellenar RefinamientoBug.md:"
      - "  Fuente: {{plantillas.hu.refinamiento_bug}}"
      - "  ID: BUG-NNN"
      - "  Iteración: 1"
      - "  CA-01: 'El bug BUG-NNN no se reproduce tras la corrección'"
      - "  Síntoma: [del paso 3]"
      - "  Causa Raíz: [del paso 3]"
      - "  Archivos Afectados: [del paso 3]"
      - "  Corrección Sugerida: [SUGERIDA: instrucciones de alto nivel]"
      - "SI es --ya_corregido:"
      - "  Completar sección 'Corrección Aplicada' con commit fix y código antes/después"
      - "  Completar sección 'Lección Aprendida' (máx 3 líneas)"
      - "  Agregar fila en {{artifacts.lecciones_aprendidas}}"
      - "  Estado del bug: '✅ Corregido'"
      - "SI NO es --ya_corregido:"
      - "  Estado del bug: '🆕 HU-Bug Planificable'"
      - "Agregar fila a tabla 'Índice Rápido' de {{archivos.backlog}}:"
      - "  | BUG-NNN | [Título] | [P] | [Prioridad] | Bug | [Proyecto] | — |"
      - "Registrar en RefinamientoBug.md el campo 'HU Creada': BUG-NNN"

  - paso: "Documentar Corrección"
    obligatorio: false
    condicion: "SI el bug ya fue corregido (--ya_corregido o el usuario indica que ya lo arregló)"
    acciones:
      - "Registrar el commit fix con su mensaje"
      - "Documentar la corrección con fragmentos de código Antes/Después"
      - "Estado del bug: '✅ Corregido'"
      - "Incluir fecha de corrección"

  - paso: "Lección Aprendida"
    obligatorio: false
    condicion: "SI el bug ya fue corregido"
    acciones:
      - "Documentar qué se puede hacer para prevenir este tipo de bug en el futuro"
      - "Las recomendaciones deben ser concretas y accionables"
      - "RESTRICCIÓN: La lección debe tener entre 1 y 3 líneas máximo. Ser directo y puntual."
      - "Agregar fila en {{artifacts.lecciones_aprendidas}} con formato:"
      - "  | [NNN] | BUG-[ID] | [lección concisa: 1-3 líneas] | [acción preventiva concisa] |"
      - "SI NO existe {{artifacts.lecciones_aprendidas}} → Crear usando {{plantillas.lecciones_aprendidas}}"

# ============================================
# SALIDA
# ============================================
salida:
  archivos_generados:
    - ruta: "{{artifacts.hu_folder}}/BUG-NNN/HU.md"
    - ruta: "{{artifacts.hu_folder}}/BUG-NNN/RefinamientoBug.md"
  archivos_actualizados:
    - "{{archivos.backlog}} (fila en Índice Rápido agregada)"
    - "{{artifacts.lecciones_aprendidas}} (si bug corregido — nueva fila agregada)"
  mensaje_exito: |
    🐛 BUG REGISTRADO
    
    📋 ID: BUG-NNN
    🔴 Severidad: [severidad]
    📌 Estado: [🆕 HU-Bug Planificable / ✅ Corregido]
    
    📁 Carpeta: {{artifacts.hu_folder}}/BUG-NNN/
    📄 Archivos: HU.md, RefinamientoBug.md
  siguiente:
    - { comando: ">planificar_hu BUG-NNN", desc: "Planificar resolución del bug (paso directo — sin refinar_hu ni validar_hu)", chat_agente: "ArchDev Pro" }
    - { comando: ">ejecutar_plan BUG-NNN", desc: "Ejecutar corrección directamente (si ya hay plan)", chat_agente: "Desarrollador" }

# ============================================
# ERRORES
# ============================================
errores:
  backlog_no_encontrado: {msg: "❌ No se encontró {{archivos.backlog}}", accion: "Ejecutar >refinar_hu para crear el backlog primero"}
  hu_folder_no_existe: {msg: "⚠️ La carpeta {{artifacts.hu_folder}} no existe", accion: "Crear la carpeta automáticamente antes de guardar"}
  bug_ya_existe: {msg: "⚠️ Ya existe una carpeta BUG-NNN con ese ID", accion: "Incrementar el ID y reintentar"}
